name: ebank
description: eBank - Sentin8 demo banking application (FDX Data Provider). Flutter (iOS, Android, Web).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_svg: ^2.0.10+1
  web: ^1.1.1
  google_fonts: ^8.1.0
  sentin8:
    path: ../../sentin8/sentin8-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logos/